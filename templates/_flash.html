{% with messages = get_flashed_messages(with_categories=true) %}

{% if messages %}

<div class="flash-messages">

    {% for category, message in messages %}

    <div class="flash flash-{{ category }}">
        {{ message }}
    </div>

    {% endfor %}

</div>

<style>
    .flash-messages {
        max-width: 600px;
        margin: 16px auto;
        padding: 0 16px;
    }

    .flash {
        padding: 12px 16px;
        margin-bottom: 8px;
        border-radius: 6px;
        font-family: Arial, sans-serif;
        font-size: 14px;
    }

    .flash-success {
        background: #e6f4ea;
        color: #1e6b34;
        border: 1px solid #b7dfc2;
    }

    .flash-danger {
        background: #fdecea;
        color: #8a1f17;
        border: 1px solid #f5c2bd;
    }

    .flash-warning {
        background: #fff6e0;
        color: #7a5200;
        border: 1px solid #f3dca0;
    }
</style>

{% endif %}

{% endwith %}
