{% extends "base.html" %}

{% block title %}{{ "Edit application" if editing else "Add application" }}{% endblock %}

{% block content %}

<div class="page-head">
    <div>
        <span class="eyebrow">Application tracker</span>
        <h1>{{ "Edit application" if editing else "Add an application" }}</h1>
    </div>
    <a href="/applications" class="btn btn-ghost"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i> Applications</a>
</div>

<form method="POST" class="card" style="max-width: 760px;">
    {{ csrf_field() }}

    <div class="grid grid-2">
        <div class="field">
            <label for="company">Company</label>
            <input class="input" id="company" name="company" maxlength="200" required value="{{ item.company or '' }}">
        </div>
        <div class="field">
            <label for="job_title">Job title</label>
            <input class="input" id="job_title" name="job_title" maxlength="200" required value="{{ item.job_title or '' }}">
        </div>
    </div>

    <div class="grid grid-3">
        <div class="field">
            <label for="status">Status</label>
            <select class="input" id="status" name="status">
                {% for key, label in statuses %}<option value="{{ key }}" {% if key == (item.status or "saved") %}selected{% endif %}>{{ label }}</option>{% endfor %}
            </select>
        </div>
        <div class="field">
            <label for="applied_on">Applied on</label>
            <input class="input" type="date" id="applied_on" name="applied_on" value="{{ item.applied_on or '' }}">
        </div>
        <div class="field">
            <label for="interview_on">Interview on</label>
            <input class="input" type="date" id="interview_on" name="interview_on" value="{{ item.interview_on or '' }}">
        </div>
    </div>

    <div class="grid grid-2">
        <div class="field">
            <label for="version_id">Resume version sent <span class="muted small">(optional)</span></label>
            <select class="input" id="version_id" name="version_id">
                <option value="">—</option>
                {% for v in versions %}<option value="{{ v.version_id }}" {% if item.version_id == v.version_id %}selected{% endif %}>{{ v.label }}</option>{% endfor %}
            </select>
        </div>
        <div class="field">
            <label for="saved_job_id">Saved job <span class="muted small">(optional)</span></label>
            <select class="input" id="saved_job_id" name="saved_job_id">
                <option value="">—</option>
                {% for j in saved_jobs %}<option value="{{ j.job_id }}" {% if item.saved_job_id == j.job_id %}selected{% endif %}>{{ j.title or "Untitled job" }}{% if j.company %} · {{ j.company }}{% endif %}</option>{% endfor %}
            </select>
        </div>
    </div>

    <div class="field">
        <label for="job_url">Link to the posting <span class="muted small">(optional)</span></label>
        <input class="input" type="url" id="job_url" name="job_url" maxlength="500" placeholder="https://" value="{{ item.job_url or '' }}">
    </div>

    <div class="field">
        <label for="notes">Notes <span class="muted small">(optional)</span></label>
        <textarea class="input" id="notes" name="notes" maxlength="5000" style="min-height: 120px;" placeholder="Recruiter name, salary, next steps…">{{ item.notes or '' }}</textarea>
    </div>

    <button type="submit" class="btn btn-primary"><i class="fa-solid fa-floppy-disk" aria-hidden="true"></i> Save</button>
</form>

{% endblock %}
